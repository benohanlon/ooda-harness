</style><rect width="1024" height="1536" fill="#031C1D"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F17435"/></marker></defs><text x="40" y="52" font-size="31" fill="#B8F4DC" class="mono" text-anchor="start" >SOVEREIGN OODA HARNESS</text><text x="40" y="96" font-size="27" fill="#B8F4DC" class="sans" text-anchor="start" >From human purpose to bounded work</text><path d="M40 122L984 122" fill="none" stroke="#B8F4DC" stroke-width="2" /><rect x="130" y="158" width="710" height="85" rx="10" fill="#031C1D" stroke="#F17435" stroke-width="2"/><text x="485.0" y="192" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >The sovereign</text><text x="485.0" y="221" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Human purpose, judgement and authority</text><rect x="130" y="290" width="710" height="85" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="485.0" y="324" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >The ecology</text><text x="485.0" y="353" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Roles · projects · people · knowledge</text><path d="M130 199L70 199L70 333L125 333" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="270" font-size="19" fill="#F17435" class="mono" text-anchor="start" >Direction</text><path d="M840 332L944 332L944 200L845 200" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><text x="973" y="273" font-size="18" fill="#F17435" class="mono" text-anchor="end" >Feedback</text><rect x="55" y="427" width="735" height="530" rx="12" fill="none" stroke="#B8F4DC" stroke-width="3"/><text x="85" y="475" font-size="35" fill="#B8F4DC" class="sans" text-anchor="start" >One enduring role</text><text x="85" y="515" font-size="21" fill="#B8F4DC" class="small" text-anchor="start" >One accountable agent for ordinary work.</text><text x="85" y="553" font-size="19" fill="#F17435" class="mono" text-anchor="start" >Selective paired mode for evaluation / high-value work</text><rect x="90" y="579" width="665" height="106" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="422.5" y="613" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Combined governing basis</text><text x="422.5" y="642" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Shared role + private application</text><text x="422.5" y="671" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Purpose · contract · system-wide units of account</text><rect x="90" y="725" width="310" height="156" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="245.0" y="759" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Agent A / doer</text><text x="245.0" y="788" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Complete OODA</text><text x="245.0" y="817" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Observe · Orient</text><text x="245.0" y="846" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Decide · Act</text><rect x="445" y="725" width="310" height="156" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="600.0" y="759" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Agent B / receiver</text><text x="600.0" y="788" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Complete OODA</text><text x="600.0" y="817" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Observe · Orient</text><text x="600.0" y="846" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Decide · Act</text><path d="M405 768L440 768" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><path d="M440 835L405 835" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><text x="422" y="924" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Evidence · challenge · correction · reversible positions</text><rect x="812" y="589" width="192" height="105" rx="10" fill="#031C1D" stroke="#F17435" stroke-width="2"/><text x="908.0" y="623" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >World &amp;</text><text x="908.0" y="652" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >other people</text><path d="M790 620L806 620" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><path d="M812 676L797 676" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><text x="906" y="735" font-size="16" fill="#F17435" class="small" text-anchor="middle" >Action / response</text><rect x="55" y="1010" width="915" height="110" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="512.5" y="1044" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Maintained context</text><text x="512.5" y="1073" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Guidance · private profile · prior learning</text><text x="512.5" y="1102" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Retrieve / retain with the existing owner</text><path d="M420 957L420 1003" fill="none" stroke="#F17435" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="55" y="1175" width="915" height="132" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="512.5" y="1209" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Bounded contributions</text><text x="512.5" y="1238" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Temporary workers · skills · tools · records</text><text x="512.5" y="1267" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Useful work and evidence return to the accountable role</text><path d="M55 925L25 925L25 1230L50 1230" fill="none" stroke="#F17435" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><rect x="55" y="1364" width="915" height="86" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="512.5" y="1398" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Enabling infrastructure</text><text x="512.5" y="1427" font-size="20" fill="#B8F4DC" class="small" text-anchor="middle" >Models · runtimes · connectors · storage · compute</text><path d="M40 1485L984 1485" fill="none" stroke="#B8F4DC" stroke-width="2" /><text x="40" y="1517" font-size="16" fill="#B8F4DC" class="small" text-anchor="start" >Illustration in development. Written contracts govern interpretation.</text></svg>
