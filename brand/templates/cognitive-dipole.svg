</style><rect width="1254" height="1254" fill="#031C1D"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#F17435"/></marker></defs><text x="45" y="48" font-size="21" fill="#B8F4DC" class="mono" text-anchor="start" >SOVEREIGN OODA HARNESS</text><path d="M45 66L1209 66" fill="none" stroke="#B8F4DC" stroke-width="2" /><text x="45" y="135" font-size="65" fill="#B8F4DC" class="sans" text-anchor="start" >The cognitive dipole</text><text x="45" y="182" font-size="32" fill="#B8F4DC" class="sans" text-anchor="start" >One role. Two agents. A shared purpose.</text><text x="45" y="224" font-size="19" fill="#F17435" class="mono" text-anchor="start" >PAIRED MODE / SELECTIVELY COMMISSIONED</text><rect x="35" y="270" width="1090" height="550" rx="45" fill="none" stroke="#5F8D85" stroke-width="2"/><circle cx="225" cy="500" r="155" fill="#031C1D" stroke="#B8F4DC" stroke-width="3"/><circle cx="600" cy="500" r="175" fill="#031C1D" stroke="#B8F4DC" stroke-width="3"/><circle cx="960" cy="500" r="155" fill="#031C1D" stroke="#B8F4DC" stroke-width="3"/><text x="225" y="451" font-size="34" fill="#B8F4DC" class="sans" text-anchor="middle" >Agent A</text><text x="225" y="487" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Doer / builder / giver</text><text x="225" y="523" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Complete OODA</text><text x="225" y="559" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Observe · Orient</text><text x="225" y="595" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Decide · Act</text><text x="960" y="451" font-size="34" fill="#B8F4DC" class="sans" text-anchor="middle" >Agent B</text><text x="960" y="487" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Observer / active receiver</text><text x="960" y="523" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Complete OODA</text><text x="960" y="559" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Observe · Orient</text><text x="960" y="595" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Decide · Act</text><text x="600" y="440" font-size="32" fill="#B8F4DC" class="sans" text-anchor="middle" >Shared nucleus</text><text x="600" y="474" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Role purpose &amp; contract</text><text x="600" y="508" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Combined shared/private basis</text><text x="600" y="542" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >System-wide units of account</text><text x="600" y="576" font-size="18" fill="#B8F4DC" class="small" text-anchor="middle" >Numbers before strategy</text><path d="M300 350Q600 280 889 350" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><path d="M885 678Q600 720 310 677" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="294" font-size="22" fill="#B8F4DC" class="small" text-anchor="middle" >Evidence · challenge · correction</text><text x="600" y="749" font-size="26" fill="#F17435" class="sans" text-anchor="middle" >Complementary, reversible polarities</text><text x="600" y="787" font-size="22" fill="#B8F4DC" class="small" text-anchor="middle" >One owner per shared action.</text><text x="600" y="874" font-size="28" fill="#B8F4DC" class="sans" text-anchor="middle" >Bounded contributions</text><rect x="65" y="908" width="305" height="68" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="217.5" y="942" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Find prior work</text><rect x="425" y="908" width="305" height="68" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="577.5" y="942" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Check a source</text><rect x="785" y="908" width="305" height="68" rx="10" fill="#031C1D" stroke="#5F8D85" stroke-width="2"/><text x="937.5" y="942" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >Test a claim</text><path d="M225 815L225 900" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><path d="M960 900L960 820" fill="none" stroke="#F17435" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="1019" font-size="21" fill="#B8F4DC" class="small" text-anchor="middle" >Temporary contributors return evidence.</text><rect x="375" y="1085" width="450" height="65" rx="10" fill="#031C1D" stroke="#F17435" stroke-width="2"/><text x="600.0" y="1119" font-size="25" fill="#B8F4DC" class="sans" text-anchor="middle" >World &amp; other people</text><path d="M1125 545L1200 545L1200 1117L830 1117" fill="none" stroke="#F17435" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1190" y="982" font-size="19" fill="#B8F4DC" class="small" text-anchor="end" >Action / response</text><path d="M45 1182L1209 1182" fill="none" stroke="#B8F4DC" stroke-width="2" /><text x="45" y="1215" font-size="17" fill="#B8F4DC" class="small" text-anchor="start" >Ordinary work can use one accountable agent. Illustration, not runtime evidence.</text></svg>
