</style><rect width="1536" height="1024" fill="#031C1D"/><defs><clipPath id="picture"><rect x="24" y="60" width="1488" height="744"/></clipPath></defs><image href="../assets/character-sources/baldwin-source.png" x="0" y="0" width="1536" height="1024" clip-path="url(#picture)"/><text x="62" y="133" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >A King may move a man,</text><text x="62" y="167" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >a father may claim a son, but remember that</text><text x="62" y="201" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >even when those who move you be Kings, or men of power,</text><text x="62" y="270" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="700" style="font-weight:700" >your soul is in your keeping alone.</text><text x="62" y="336" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >When you stand before God, you cannot say,</text><text x="62" y="383" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >“But I was told by others to do thus.”</text><text x="62" y="430" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >Or that, “Virtue was not convenient at the time.”</text><text x="62" y="520" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >This will not suffice.</text><text x="62" y="556" font-size="30" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >Remember that.</text><rect x="12" y="12" width="1512" height="1000" fill="none" stroke="#B8F4DC" stroke-width="2"/><path d="M40 25L40 46" fill="none" stroke="#F17435" stroke-width="4" /><text x="61" y="45" font-size="26" fill="#B8F4DC" class="mono" text-anchor="start" letter-spacing="5">HERMES</text><text x="1501" y="42" font-size="18" fill="#B8F4DC" class="small" text-anchor="end" letter-spacing="1.7">OODA HARNESS / PROFILE PACK 001</text><path d="M26 58L1510 58" fill="none" stroke="#B8F4DC" stroke-width="2" /><path d="M26 804L1510 804" fill="none" stroke="#B8F4DC" stroke-width="2" /><path d="M26 970L1510 970" fill="none" stroke="#B8F4DC" stroke-width="2" /><path d="M500 820L500 954" fill="none" stroke="#F17435" stroke-width="3" /><text x="38" y="932" font-size="116" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="900" style="font-weight:900" data-slot="name">BALDWIN</text><text x="530" y="851" font-size="41" fill="#B8F4DC" class="condensed" text-anchor="start" letter-spacing="1.5" data-slot="role">CHIEF OF STAFF</text><text x="530" y="926" font-size="29" fill="#F17435" class="condensed" text-anchor="start" font-weight="700" style="font-weight:700" data-slot="quote">Your soul is in your keeping alone.</text><text x="1500" y="869" font-size="16" fill="#B8F4DC" class="small" text-anchor="end" letter-spacing="1.6" data-slot="qualities">CALM AUTHORITY</text><text x="1500" y="900" font-size="16" fill="#B8F4DC" class="small" text-anchor="end" letter-spacing="1.6" data-slot="qualities">JUDGEMENT / FOLLOW-THROUGH</text><text x="39" y="995" font-size="15" fill="#B8F4DC" class="small" text-anchor="start" >Archetype: King Baldwin IV / Kingdom of Heaven (2005)   |   Source: user-supplied film image</text></svg>
