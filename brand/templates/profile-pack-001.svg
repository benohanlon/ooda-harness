<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title"><title id="title">BALDWIN / CHIEF OF STAFF / Profile Pack 001</title><style>
