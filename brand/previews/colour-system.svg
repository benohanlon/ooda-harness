<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title"><title id="title">OODA shared colour system</title><style>
@font-face{font-family:OodaMono;src:url('../fonts/IBMPlexMono-Regular.ttf');font-weight:400}
@font-face{font-family:OodaMono;src:url('../fonts/IBMPlexMono-Medium.ttf');font-weight:500}
@font-face{font-family:OodaSans;src:url('../fonts/Inter-Bold.woff2');font-weight:700}
@font-face{font-family:OodaCondensed;src:url('../fonts/BarlowCondensed-Regular.ttf');font-weight:400}
@font-face{font-family:OodaCondensed;src:url('../fonts/BarlowCondensed-Bold.ttf');font-weight:700}
@font-face{font-family:OodaCondensed;src:url('../fonts/BarlowCondensed-Black.ttf');font-weight:900}
text{font-kerning:normal;text-rendering:geometricPrecision}
.mono,.small{font-family:OodaMono,monospace;font-weight:400}
.mono{font-weight:500}.message,.sans{font-family:OodaSans,sans-serif;font-weight:700}
.condensed{font-family:OodaCondensed,sans-serif;font-weight:700}
</style><rect width="1280" height="530" fill="#031C1D"/><text x="48" y="70" font-size="30" fill="#B8F4DC" class="mono" text-anchor="start" >OODA / COLOUR SYSTEM</text><rect x="48" y="125" width="260" height="200" fill="#031C1D" stroke="#B8F4DC"/><text x="48" y="370" font-size="21" fill="#B8F4DC" class="mono" text-anchor="start" >PETROL DARK</text><text x="48" y="410" font-size="25" fill="#B8F4DC" class="mono" text-anchor="start" >#031C1D</text><rect x="344" y="125" width="260" height="200" fill="#B8F4DC" stroke="#B8F4DC"/><text x="344" y="370" font-size="21" fill="#B8F4DC" class="mono" text-anchor="start" >MINT</text><text x="344" y="410" font-size="25" fill="#B8F4DC" class="mono" text-anchor="start" >#B8F4DC</text><rect x="640" y="125" width="260" height="200" fill="#5F8D85" stroke="#B8F4DC"/><text x="640" y="370" font-size="21" fill="#B8F4DC" class="mono" text-anchor="start" >MUTED TEAL</text><text x="640" y="410" font-size="25" fill="#B8F4DC" class="mono" text-anchor="start" >#5F8D85</text><rect x="936" y="125" width="260" height="200" fill="#F17435" stroke="#B8F4DC"/><text x="936" y="370" font-size="21" fill="#B8F4DC" class="mono" text-anchor="start" >SIGNAL ORANGE</text><text x="936" y="410" font-size="25" fill="#B8F4DC" class="mono" text-anchor="start" >#F17435</text><text x="48" y="480" font-size="20" fill="#B8F4DC" class="small" text-anchor="start" >Flat ink colours for live type and diagrams; artwork retains its tonal range.</text></svg>
