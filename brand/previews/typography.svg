<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title"><title id="title">OODA shared live typography</title><style>
@font-face{font-family:OodaMono;src:url('../fonts/IBMPlexMono-Regular.ttf');font-weight:400}
@font-face{font-family:OodaMono;src:url('../fonts/IBMPlexMono-Medium.ttf');font-weight:500}
@font-face{font-family:OodaSans;src:url('../fonts/Inter-Bold.woff2');font-weight:700}
@font-face{font-family:OodaCondensed;src:url('../fonts/BarlowCondensed-Regular.ttf');font-weight:400}
@font-face{font-family:OodaCondensed;src:url('../fonts/BarlowCondensed-Bold.ttf');font-weight:700}
@font-face{font-family:OodaCondensed;src:url('../fonts/BarlowCondensed-Black.ttf');font-weight:900}
text{font-kerning:normal;text-rendering:geometricPrecision}
.mono,.small{font-family:OodaMono,monospace;font-weight:400}
.mono{font-weight:500}.message,.sans{font-family:OodaSans,sans-serif;font-weight:700}
.condensed{font-family:OodaCondensed,sans-serif;font-weight:700}
</style><rect width="1440" height="720" fill="#031C1D"/><text x="50" y="70" font-size="30" fill="#B8F4DC" class="mono" text-anchor="start" >OODA / TYPE SYSTEM</text><text x="50" y="210" font-size="102" fill="#B8F4DC" class="condensed" text-anchor="start" font-weight="900" style="font-weight:900" >BALDWIN · BLAKE · HARRY</text><text x="50" y="285" font-size="22" fill="#F17435" class="mono" text-anchor="start" >BARLOW CONDENSED / NAMES AND ROLE TITLES</text><text x="50" y="365" font-size="45" fill="#F17435" class="condensed" text-anchor="start" font-weight="400" style="font-weight:400" >Right now I’m in first gear.</text><text x="50" y="423" font-size="45" fill="#F17435" class="condensed" text-anchor="start" font-weight="700" style="font-weight:700" >Would you like to see me shift to six?</text><text x="50" y="495" font-size="19" fill="#B8F4DC" class="mono" text-anchor="start" >ONE FAMILY / SAME SIZE / DELIBERATE WEIGHT CONTRAST</text><text x="50" y="580" font-size="25" fill="#B8F4DC" class="mono" text-anchor="start" >IBM Plex Mono / headers, pack IDs, metadata</text><text x="50" y="655" font-size="30" fill="#B8F4DC" class="sans" text-anchor="start" >Inter Bold / messages and diagram hierarchy</text></svg>
